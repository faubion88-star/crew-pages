<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GP test crew</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-hand phone tool. Sticky header with section chips, a scrollable rear-view wall strip, the tapped column's card, bottom tab bar. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#15181d; --muted:#5d6672; --line:#d5d9df; --tile:#ffffff; --tileLine:#9aa3ad;
  --accent:#1f5fd6; --accentInk:#ffffff; --sel:#ffb000; --bad:#c62828; --pw:#1f5fd6; --soft:#e8ebf0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:Barlow,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1114; --surface:#1a1d22; --ink:#eef1f5; --muted:#9aa3ad; --line:#2c3139; --tile:#22262c; --tileLine:#4a525d;
  --accent:#5b8cff; --accentInk:#0f1114; --sel:#ffc23d; --bad:#ff6b6b; --pw:#6f9bff; --soft:#252a31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1114; --surface:#1a1d22; --ink:#eef1f5; --muted:#9aa3ad; --line:#2c3139; --tile:#22262c; --tileLine:#4a525d;
  --accent:#5b8cff; --accentInk:#0f1114; --sel:#ffc23d; --bad:#ff6b6b; --pw:#6f9bff; --soft:#252a31; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 10px;display:grid;gap:8px}
.top{display:flex;align-items:baseline;gap:10px;min-width:0}
.top h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .meta{color:var(--muted);font-size:13px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap;cursor:pointer}
.chips:empty{display:none}
#scr .chip{font-size:17px;border-radius:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:focus-visible,button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.mock{font-size:12px;color:var(--muted)}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:14px;padding-block:14px}
.label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.wall{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wallHead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 0}
.rv{font-family:var(--display);font-weight:700;color:var(--bad);font-size:15px;letter-spacing:.04em}
.strip{overflow-x:auto;padding:8px 12px 10px;overscroll-behavior-x:contain}
.strip svg{display:block}
.hint{font-size:13px;color:var(--muted);padding:0 12px 10px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;min-width:0}
.colHead{display:flex;align-items:center;gap:10px}
.colNum{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.colSub{color:var(--muted);font-size:14px}
.nav{margin-left:auto;display:flex;gap:8px}
.nav button{width:52px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font-size:22px;cursor:pointer}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.kind{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff;min-width:64px;text-align:center}
.what{min-width:0}
.what b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.01em}
.what div{color:var(--muted);font-size:14px}
.len{display:inline-grid;place-items:center;min-width:56px;height:36px;border-radius:8px;border:1.5px solid rgba(0,0,0,.35);font-family:var(--display);font-weight:700;font-size:20px;padding:0 8px;position:relative;overflow:hidden}
.len span{position:relative;z-index:1;background:#fff;color:#111;border-radius:4px;padding:0 4px}
.len.solid span{background:none;color:inherit;padding:0}
.list{display:grid;gap:0}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tag{font-family:var(--display);font-weight:700;font-size:18px;color:#fff;border-radius:7px;padding:4px 10px;min-width:62px;text-align:center}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;background:#ffe24a;border:1px solid #333;display:inline-block;vertical-align:-1px;margin-right:4px}
.soca{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.soca:first-child{border-top:0}
.socaTop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.socaName{font-family:var(--display);font-weight:700;font-size:22px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--pw) 18%,var(--surface));border:2px solid var(--pw)}
.pcs{display:flex;gap:6px;flex-wrap:wrap}
.brks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.brk{background:var(--soft);border-radius:8px;padding:6px 8px;font-size:14px}
.brk b{font-family:var(--display);font-size:17px;color:var(--pw)}
.brk.spare{color:var(--bad)}
.check{display:grid;grid-template-columns:28px 52px 1fr;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:24px;height:24px;accent-color:var(--accent)}
.check .q{font-family:var(--display);font-weight:700;font-size:20px;text-align:right}
.check.done .d,.check.done .q{color:var(--muted);text-decoration:line-through}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog div{height:100%;background:var(--accent);transition:width .2s}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.tabs button{border:0;background:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;padding:8px 0 6px;border-radius:10px;display:grid;justify-items:center;gap:2px;cursor:pointer}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--soft)}
.small{font-size:13px;color:var(--muted);margin:0}
@media (min-width:720px){main .wrap{max-width:760px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<header><div class="wrap">
  <div class="top"><h1 id="title"></h1><span class="meta" id="meta"></span></div>
  <div class="chips" id="scr" role="group" aria-label="Screen"></div>
  <div class="chips" id="chips" role="group" aria-label="Processor section"></div>
  <div class="mock" id="made"></div>
</div></header>

<main><div class="wrap">
  <section class="view" id="v-wall"></section>
  <section class="view" id="v-boxes" hidden></section>
  <section class="view" id="v-power" hidden></section>
  <section class="view" id="v-pull" hidden></section>
</div></main>

<nav class="tabs" aria-label="Views"><div class="wrap" role="tablist">
  <button role="tab" data-v="wall" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12"/><path d="M9 5v12M15 5v12M3 11h18"/></svg>Wall</button>
  <button role="tab" data-v="boxes" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="1"/><path d="M8 12h2M12 12h2M16 12h0"/></svg>Boxes</button>
  <button role="tab" data-v="power" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Power</button>
  <button role="tab" data-v="pull" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Pull</button>
</div></nav>

function wallSVG(){const [a,b]=secCols(),n=b-a+1;const avail=Math.max(280,Math.min(700,window.innerWidth-60));

function colCard(){const col=D.cols[st.col-1];if(!col)return "";const P=col.runs.find(r=>r.kind==="P"),Rr=col.runs.find(r=>r.kind==="R"),pw=col.pwr;

function renderBoxes(){const [a,b]=secCols();const bs=D.boxes.filter(x=>x.col>=a&&x.col<=b);
  if(!D.boxes.length){$("v-boxes").innerHTML='<div class="card"><p style="margin:0">No boxes on this screen. Data runs come straight from the processor'+(D.procPos?', placed '+esc(D.procPos):'')+'.</p></div>';return}
  $("v-boxes").innerHTML='<p class="label">'+esc(D.boxType||"Box")+'s on the wall · '+bs.length+' pair'+(bs.length===1?"":"s")+'</p><div class="card"><div class="list">'+bs.map(x=>{const prev=D.boxes[D.boxes.indexOf(x)-1];
    return '<div class="item"><span class="tag" style="background:'+hueOf(x.lab.split("/")[0])+'">'+esc(x.lab)+'</span><div><div class="t">Hang behind column '+x.col+'</div><div class="s">'+(x.feed==="home"?'<span class="dot"></span>Tac-12 home run '+x.run+' from '+esc(x.proc):'Tac-12 jump '+x.jump+"' from "+esc(prev?prev.lab:""))+' · '+x.ports+' ports</div></div><span></span></div>'}).join("")+'</div></div>'+
    '<p class="small">Each '+esc(D.boxType||"box")+' gets an LC-ST jumper and 2 ST barrels. Main and backup hang side by side.</p>'}

function renderPower(){const [a,b]=secCols();const ss=D.socas.filter(s=>s.ckts.some(c=>c.cols.some(x=>x>=a&&x<=b)));
  $("v-power").innerHTML='<p class="label">Socas · distro '+(D.distro.pos==="center"?"center":"stage "+D.distro.pos)+', '+D.distro.ft+"' out</p>"+'<div class="card"><div class="list">'+ss.map(s=>'<div class="soca"><div class="socaTop"><span class="socaName">'+esc(s.n)+'</span><div class="pcs">'+s.pieces.map(p=>lenChip(p,true)).join("")+'</div><span class="small" style="margin-left:auto">'+(s.pieces.length>1?"joined run":"")+'</span></div>'+
    '<div class="brks">'+s.ckts.map(c=>'<div class="brk"><b>'+c.brk+'</b> · cols '+c.cols[0]+(c.cols.length>1?"–"+c.cols[c.cols.length-1]:"")+'<br><span class="small">'+(c.fer>1?c.fer+"-fer":"direct")+'</span></div>').join("")+Array.from({length:s.spares},(_,i)=>'<div class="brk spare"><b style="color:var(--bad)">'+(s.ckts.length+i+1)+'</b> · spare</div>').join("")+'</div></div>').join("")+'</div></div>'}

function renderPull(){const PK=KEY+st.scr+".pull";const done=store.get(PK,{});const n=D.pull.filter((p,i)=>done[i]).length;
  $("v-pull").innerHTML='<p class="label">Pull list · '+n+' of '+D.pull.length+' pulled</p><div class="prog"><div style="width:'+(n/D.pull.length*100)+'%"></div></div><div class="card"><div class="list">'+D.pull.map((p,i)=>'<label class="check'+(done[i]?" done":"")+'"><input type="checkbox" id="pl'+i+'" data-pl="'+i+'"'+(done[i]?" checked":"")+'><span class="q">'+p[0]+'</span><span class="d">'+esc(p[1])+'</span></label>').join("")+'</div></div><p class="small">Check-offs are saved on this phone only.</p>';
  $("v-pull").querySelectorAll("[data-pl]").forEach(cb=>cb.addEventListener("change",()=>{const d=store.get(PK,{});d[cb.dataset.pl]=cb.checked;store.set(PK,d);renderPull()}))}

function render(){$("title").textContent=D.screen;$("meta").textContent=D.bit+"-bit · "+D.C+"×"+D.R+" · "+D.panel.replace(/^ROE Visual /,"");$("made").textContent=ALL.show+" · made "+ALL.made;renderChips();
  ({wall:renderWall,boxes:renderBoxes,power:renderPower,pull:renderPull})[st.view]();
  document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="v-"+st.view);
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===st.view))}

$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-sec]");if(!b)return;st.sec=+b.dataset.sec;store.set(KEY+st.scr+".sec",st.sec);const [a,c]=secCols();if(st.col<a||st.col>c){st.col=c;store.set(KEY+st.scr+".col",c)}render();window.scrollTo(0,0)});
$("scr").addEventListener("click",e=>{const b=e.target.closest("[data-scr]");if(!b)return;useScreen(+b.dataset.scr);render();window.scrollTo(0,0)});
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;st.view=b.dataset.v;render();window.scrollTo(0,0)});
$("v-wall").addEventListener("click",e=>{const b=e.target.closest("[data-step]");if(b)pick(st.col+ +b.dataset.step)});
window.addEventListener("resize",()=>{if(st.view==="wall")renderWall()});
useScreen(st.scr);render();
</script>
</body></html>
